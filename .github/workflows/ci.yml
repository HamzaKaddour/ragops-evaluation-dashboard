name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi httpx pytest numpy
          pip install -e . --no-deps
      - name: Run lightweight tests
        run: pytest -q tests/test_metrics.py tests/test_citations.py tests/test_grounding.py tests/test_confidence.py tests/test_api.py
