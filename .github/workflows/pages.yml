name: Deploy static dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare static portfolio artifacts
        run: |
          mkdir -p static/data
          cp data/evaluation_summary.json static/data/evaluation_summary.json
          cp data/rag_runs.json static/data/rag_runs.json
          if [ -f data/final_benchmark_summary.json ]; then
            cp data/final_benchmark_summary.json static/data/final_benchmark_summary.json
          fi
          if [ -f data/final_benchmark_runs.json ]; then
            cp data/final_benchmark_runs.json static/data/final_benchmark_runs.json
          fi
          if [ -f data/reliability_history.json ]; then
            cp data/reliability_history.json static/data/reliability_history.json
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
