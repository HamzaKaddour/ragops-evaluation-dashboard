[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragops-evaluation-dashboard"
version = "0.6.0"
description = "Local-first RAG evaluation and observability platform"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["ragops*", "api*"]
